<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naryun Woo | Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pretendard:wght@400;500;700&display=swap');
        body { font-family: 'Inter', 'Pretendard', sans-serif; background-color: #0f172a; color: #94a3b8; padding-top: 80px; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { sky: { 400: '#38bdf8', 500: '#0ea5e9' } } } } }
    </script>
</head>
<body class="selection:bg-sky-500 selection:text-white antialiased">
    <div class="fixed inset-0 z-30 pointer-events-none transition duration-300" id="spotlight" style="background: radial-gradient(600px at 50% 50%, rgba(56, 189, 248, 0.15), transparent 80%);"></div>

    <!-- Load Header file  -->
    <div id="header-container"></div>
    <script>
        async function loadHeader() {
            try {
                const response = await fetch('header.html');
                if (!response.ok) throw new Error('헤더 파일을 찾을 수 없습니다.');
                const data = await response.text();
                document.getElementById('header-container').innerHTML = data;
                
                // 헤더가 로드된 후 실행
                highlightCurrentMenu();
            } catch (error) {
                console.error('헤더를 불러오는 중 오류가 발생했습니다:', error);
            }
        }
    
        function highlightCurrentMenu() {
            let currentPage = window.location.pathname.split("/").pop();
            if (currentPage === "" || currentPage === "index.html") currentPage = "index.html"; 
        
            const navLinks = document.querySelectorAll('#header-container a');
            
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                
                if (link.id === 'logo') return; 
        
                if (href === currentPage) {
                    link.classList.add('text-amber-400', 'font-bold');
                    link.classList.remove('text-slate-300');
                } else {
                    link.classList.remove('text-amber-400', 'font-bold');
                    link.classList.add('text-slate-300');
                }
            });
        }
    
        loadHeader(); 
    </script>

    <main class="max-w-3xl mx-auto px-6 py-12 md:py-20 space-y-24 relative z-40">
        <section>
            <h3 class="text-2xl font-bold text-slate-200 mb-10 border-l-4 border-sky-500 pl-4">Projects</h3>
            <div class="space-y-12">
                <div class="group relative bg-slate-800/50 p-6 rounded-xl hover:bg-slate-800 transition border border-slate-700/50 hover:border-sky-500/50">
                    <div class="flex justify-between items-baseline mb-2">
                        <h4 class="text-xl font-bold text-slate-200 group-hover:text-sky-400 transition">Green Market</h4>
                        <span class="text-xs font-mono text-slate-500">2024.11 — 12</span>
                    </div>
                    <p class="text-slate-400 mb-4">중고장터 웹 애플리케이션 개발. 데이터베이스 설계 및 풀스택 연동을 담당.</p>
                    <div class="flex gap-2 text-xs font-mono text-sky-300">
                        <span class="bg-sky-500/10 px-2 py-1 rounded">JavaScript</span>
                        <span class="bg-sky-500/10 px-2 py-1 rounded">SQL</span>
                    </div>
                </div>
                </div>
        </section>
    </main>
    
    <footer class="py-8 text-center text-sm text-slate-600 border-t border-slate-800/50"><p>© 2026 Naryun Woo.</p></footer>
    <script>
        const spotlight = document.getElementById('spotlight');
        document.addEventListener('mousemove', (e) => { spotlight.style.background = `radial-gradient(600px at ${e.clientX}px ${e.clientY}px, rgba(56, 189, 248, 0.15), transparent 80%)`; });
    </script>
</body>
</html>
